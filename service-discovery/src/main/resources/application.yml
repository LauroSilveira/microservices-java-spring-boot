server:
  port: 8761

spring:
  application:
    name: service-discovery


eureka:
  instance:
    # When microservices are registered on Eureka, it returns localhost as instance address and inside of POD
    # that points to itself.
    hostname: ${EUREKA_HOSTNAME:$localhost}
    # is necessary to set a FALSE register-with-eureka and fetch-registry
    # to tell that microservice is a server and not a client
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${SERVER_HOST:http://localhost:8761/eureka}